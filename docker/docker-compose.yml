services:
  antigravity-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lbjlaq/antigravity-manager
    container_name: antigravity-manager
    network_mode: host  # 使用宿主机网络，可直接访问 localhost:8045
    # ports:  # host 模式不需要端口映射
    #   - "8045:8045"
    volumes:
      - ~/.antigravity_tools:/root/.antigravity_tools
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # [SECURITY] No default credential on purpose. Set API_KEY in your .env or shell
      # before starting: a shipped default such as "test" is the first thing an attacker
      # tries, and the admin API exposes /api/accounts/export which returns every Google
      # refresh token in clear text. Leaving it unset makes the app generate a random key
      # and print it to the container logs.
      - API_KEY=${API_KEY:?set API_KEY to a strong secret, e.g. openssl rand -hex 32}
      - ABV_BIND_LOCAL_ONLY=${ABV_BIND_LOCAL_ONLY:-true}  # 僅綁定 127.0.0.1
      - ABV_DATA_DIR=${ABV_DATA_DIR:-/root/.antigravity_tools}  # 容器内数据目录，需与上方 volume 目标路径一致
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
